services:
  patter:
    build: .
    image: patter-server
    restart: unless-stopped
    # Drop the 127.0.0.1: prefix to let other machines on the LAN use this GPU.
    ports:
      - "127.0.0.1:8765:8765"
    volumes:
      - ./data:/data
    # Files in ./data are owned by this user. Set PUID and PGID to your ids.
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
